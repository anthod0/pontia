[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Where to host releases
hosting = "github"
# Whether CI should trigger releases with dispatches instead of tag pushes
dispatch-releases = true
packages = ["pontia", "pontiad"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# The installers to generate for each app
installers = []
# Which actions to run on pull requests
pr-run-mode = "plan"
# Checksums to generate for each App
checksum = "sha256"
# Generate and dist a source tarball
source-tarball = false
# Whether to enable GitHub Attestations
github-attestations = true
# When to generate GitHub Attestations
github-attestations-phase = "host"
# Patterns to attest when creating attestations for release artifacts
github-attestations-filters = ["*.tar.gz", "*.tar.xz", "*.sha256", "*.sum", "*.json"]
