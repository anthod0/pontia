[package]
name = "pontiad"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8"
pontia-agent-clients = { path = "../agent-clients" }
pontia-application = { path = "../application" }
pontia-config = { path = "../config" }
pontia-core = { path = "../core", default-features = false }
pontia-http = { path = "../http" }
pontia-runtime = { path = "../runtime", default-features = false }
pontia-storage-sqlite = { path = "../storage-sqlite" }
pontia-workflow = { path = "../workflow" }
pontia-tunnel = { path = "../../tunnel" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { workspace = true, features = ["v7", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
http-body-util = "0.1"
pontia-edge = { path = "../../edge" }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
