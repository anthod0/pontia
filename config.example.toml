bind_addr = "127.0.0.1:8080"
external_api_token = "dev-token"
run_migrations = true

[dashboard]
# Local Vite dist directory or a remote .tar.gz/.tgz/.zip archive containing exactly one index.html.
source = "apps/dashboard/dist"
# Remote sources are cached beneath $PONTIA_HOME/cache/dashboard. If refresh
# fails, an existing cached dashboard is served.

[runtime.pi]
# Install the plugin once with `pi install ./clients/pi`; pi then loads it from user settings.
tui_command = "pi"


[workspace_browser]
roots = [
  { root_id = "projects", label = "Projects", path = "/home/me/projects" }
]

# Experimental ACP control loop: local stdio peers only. Permission interactions,
# history, recovery and Dashboard Agent selection are not implemented yet.
# Create through the Session API with client_type = "acp" and
# metadata.acp_agent_id = "company-agent". The peer must declare loadSession and close.
