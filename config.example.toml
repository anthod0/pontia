bind_addr = "127.0.0.1:8080"
external_api_token = "dev-token"
run_migrations = true

[uploads]
# Retention is measured from the start of each upload, including completed files.
incomplete_retention_days = 7
completed_retention_days = 30
# Cleanup runs at service startup and then at this interval. All values must be positive integers.
cleanup_interval_hours = 24

[dashboard]
# Local Vite dist directory or a remote .tar.gz/.tgz/.zip archive containing exactly one index.html.
source = "apps/dashboard/dist"
# Remote sources are cached beneath $PONTIA_HOME/cache/dashboard. If refresh
# fails, an existing cached dashboard is served.

[runtime.pi]
# Install the plugin once with `pi install ./clients/pi`; pi then loads it from user settings.
tui_command = "pi"


[workspace_browser]
roots = [
  { root_id = "projects", label = "Projects", path = "/home/me/projects" }
]

# ACP agents launched over local stdio. Built-in entries cover Grok Build and
# OpenCode; enable one with `pontia client enable <id>` or in Dashboard settings.
# The peer must declare loadSession and close. Use registry_id instead of
# command/args to launch an agent from the ACP registry.
# [acp.agents.company-agent]
# name = "Company Agent"
# command = "/opt/company-agent/bin/agent"
# args = ["--acp"]
# [acp.agents.company-agent.env]
# LOG_LEVEL = "info"
