"$schema" = "./node_modules/wrangler/config-schema.json"
name = "pontia-cloud"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
keep_vars = true

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[vars]
PREVIEW_ZONE = "pontia.run"
AUTH_ORIGIN = "https://pontia.dev"

[secrets]
required = [
  "GOOGLE_CLIENT_ID",
  "GOOGLE_CLIENT_SECRET",
  "GITHUB_CLIENT_ID",
  "GITHUB_CLIENT_SECRET",
  "JWT_SECRET",
  "OAUTH_COOKIE_SECRET",
  "CLOUDFLARE_DNS_TOKEN",
  "CLOUDFLARE_DNS_ZONE_ID",
  "CLOUDFLARE_PREVIEW_DNS_ZONE_ID",
  "E2E_CAPABILITY_SIGNING_KEY",
  "E2E_CAPABILITY_VERIFICATION_KEY",
  "E2E_REGISTRATION_PROOF_PRIVATE_KEY",
  "E2E_REGISTRATION_PROOF_PUBLIC_KEY",
  "LEGACY_EDGE_DNS_OWNER_IDS",
]

[[ratelimits]]
name = "EDGE_CONFIRM_RATE_LIMIT"
namespace_id = "1001"

[ratelimits.simple]
limit = 20
period = 60

[[ratelimits]]
name = "EDGE_DNS_RATE_LIMIT"
namespace_id = "1002"

[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "EDGE_HEALTH_RATE_LIMIT"
namespace_id = "1003"

[ratelimits.simple]
limit = 12
period = 60

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"
run_worker_first = [
  "/",
  "/docs",
  "/docs/*",
  "/blog",
  "/blog/*",
  "/zh",
  "/zh/*",
  "/ja",
  "/ja/*",
  "/pt-br",
  "/pt-br/*",
]

[[d1_databases]]
binding = "DB"
database_name = "pontia-cloud"
database_id = "c1c8fe42-98a7-4d89-a650-2e742a744a79"
migrations_dir = "migrations"
migrations_pattern = "migrations/*/migration.sql"
