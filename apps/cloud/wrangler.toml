"$schema" = "./node_modules/wrangler/config-schema.json"
name = "pontia-cloud"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true
keep_vars = true

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[vars]
AUTH_ORIGIN = "https://pontia.dev"

[secrets]
required = [
  "GOOGLE_CLIENT_ID",
  "GOOGLE_CLIENT_SECRET",
  "GITHUB_CLIENT_ID",
  "GITHUB_CLIENT_SECRET",
  "JWT_SECRET",
  "OAUTH_COOKIE_SECRET",
  "CLOUDFLARE_DNS_TOKEN",
  "CLOUDFLARE_DNS_ZONE_ID",
  "E2E_CAPABILITY_SIGNING_KEY",
  "E2E_CAPABILITY_VERIFICATION_KEY",
  "E2E_REGISTRATION_PROOF_PRIVATE_KEY",
  "E2E_REGISTRATION_PROOF_PUBLIC_KEY",
]

[[ratelimits]]
name = "EDGE_NETWORK_RATE_LIMIT"
namespace_id = "1001"

[ratelimits.simple]
limit = 3
period = 60

[[ratelimits]]
name = "EDGE_DNS_RATE_LIMIT"
namespace_id = "1002"

[ratelimits.simple]
limit = 10
period = 60

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "pontia-cloud"
database_id = "c1c8fe42-98a7-4d89-a650-2e742a744a79"
migrations_dir = "migrations"
migrations_pattern = "migrations/*/migration.sql"

[previews.vars]
AUTH_ORIGIN = "https://staging-pontia-cloud.anthod.workers.dev"

[[previews.d1_databases]]
binding = "DB"
database_name = "pontia-cloud-staging"
database_id = "37de0e2f-1dcd-4673-ad66-96f909c9fcec"
