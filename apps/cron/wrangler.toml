"$schema" = "./node_modules/wrangler/config-schema.json"
name = "pontia-cron"
main = "src/index.ts"
compatibility_date = "2026-08-11"
workers_dev = false
preview_urls = false
keep_vars = true

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[secrets]
required = ["CLOUDFLARE_DNS_TOKEN", "CLOUDFLARE_DNS_ZONE_ID"]

[[d1_databases]]
binding = "DB"
database_name = "pontia-cloud"
database_id = "c1c8fe42-98a7-4d89-a650-2e742a744a79"
