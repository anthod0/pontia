<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/logo.svg" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/logo-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/logo-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/logo-180.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#fafaf8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pontia Dashboard</title>
    <script>
      (() => {
        const saved = localStorage.getItem("pontia.theme");
        const dark =
          saved === "dark" ||
          (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (!dark) return;
        document.documentElement.classList.add("dark");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#1d2021");
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
