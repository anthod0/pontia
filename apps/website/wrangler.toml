"$schema" = "./node_modules/wrangler/config-schema.json"
name = "pontia-website"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true
keep_vars = true

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[vars]
AUTH_ORIGIN = "https://pontia.dev"

[secrets]
required = [
  "GOOGLE_CLIENT_ID",
  "GOOGLE_CLIENT_SECRET",
  "GITHUB_CLIENT_ID",
  "GITHUB_CLIENT_SECRET",
  "JWT_SECRET",
]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "pontia-website"
database_id = "851d7dbe-fe88-4ee8-afdf-f5dc6a42b9f7"
migrations_dir = "migrations"
migrations_pattern = "migrations/*/migration.sql"

[previews.vars]
AUTH_ORIGIN = "https://staging-pontia-website.anthod.workers.dev"

[[previews.d1_databases]]
binding = "DB"
database_name = "pontia-website-staging"
database_id = "f6b7ddb3-0d81-4677-a5f0-8344074e7856"
