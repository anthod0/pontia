name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect product version change
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        shell: bash
        env:
          BEFORE_COMMIT: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must run from the main branch" >&2
            exit 1
          fi

          python3 scripts/release-version.py check
          version="$(python3 scripts/release-version.py version)"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ -z "$BEFORE_COMMIT" || "$BEFORE_COMMIT" =~ ^0+$ ]]; then
              echo "Cannot determine the commit before this push" >&2
              exit 1
            fi
            if git cat-file -e "$BEFORE_COMMIT:VERSION" 2>/dev/null; then
              previous_version="$(git show "$BEFORE_COMMIT:VERSION" | tr -d '[:space:]')"
              if [[ "$previous_version" == "$version" ]]; then
                echo "Product version remains $version; skipping release"
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "version=$version" >> "$GITHUB_OUTPUT"
                echo "tag=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Product version changed from $previous_version to $version"
            else
              echo "VERSION is new; publishing product version $version"
            fi
          fi

          if ! grep -Fq "## [$version]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null; then
            tagged_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag already targets a different commit" >&2
              exit 1
            fi
            echo "Resuming release $tag"
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: detect
    if: ${{ needs.detect.outputs.publish == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            packages: --package pontia --package pontiad --package pontia-edge
            binaries: pontia pontiad pontia-edge
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            packages: --package pontia --package pontiad --package pontia-edge
            binaries: pontia pontiad pontia-edge
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            packages: --package pontia --package pontiad
            binaries: pontia pontiad
          - runner: macos-14
            target: aarch64-apple-darwin
            packages: --package pontia --package pontiad
            binaries: pontia pontiad
            verify_codesign: true
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build binaries
        env:
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_PUBLIC_KEY }}
          PACKAGES: ${{ matrix.packages }}
          TARGET: ${{ matrix.target }}
        run: |
          test -n "$RELEASE_PUBLIC_KEY"
          cargo build --release --locked --target "$TARGET" $PACKAGES
      - name: Verify Apple Silicon code signature
        if: matrix.verify_codesign
        env:
          TARGET: ${{ matrix.target }}
        run: |
          codesign --verify --strict --verbose=2 "target/$TARGET/release/pontia"
          codesign --verify --strict --verbose=2 "target/$TARGET/release/pontiad"
      - name: Package binaries
        shell: bash
        env:
          BINARIES: ${{ matrix.binaries }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir dist
          for binary in $BINARIES; do
            tar -C "target/$TARGET/release" -czf "dist/$binary-$TARGET.tar.gz" "$binary"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*.tar.gz
          compression-level: 0

  build-dashboard:
    name: Build local Dashboard
    needs: detect
    if: ${{ needs.detect.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Build Dashboard
        run: scripts/build-dashboard-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard
          path: pontia-dashboard.tar.gz
          compression-level: 0

  release:
    name: Publish signed release
    needs:
      - detect
      - build
      - build-dashboard
    if: ${{ needs.detect.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: dashboard
          path: artifacts
      - name: Prepare signed release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_PUBLIC_KEY }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: python3 .github/scripts/publish-release.py prepare-release artifacts --version "$TAG"
      - name: Extract release notes
        shell: bash
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Verify assets and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: python3 .github/scripts/publish-release.py publish-github-release artifacts --version "$TAG"
      - name: Publish verified release to R2 and advance stable
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: python3 .github/scripts/publish-release.py publish-release artifacts --version "$TAG"

  publish-pi-client:
    name: Publish Pi client
    needs:
      - detect
      - build
      - build-dashboard
    if: ${{ needs.detect.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11
      - name: Stage package with the product version
        env:
          STAGING: ${{ runner.temp }}/pi-client
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          mkdir "$STAGING"
          cp clients/pi/package.json clients/pi/README.md clients/pi/LICENSE "$STAGING/"
          cp -a clients/pi/src "$STAGING/src"
          python3 scripts/release-version.py materialize-npm "$STAGING/package.json"
          test "$(jq -r .version "$STAGING/package.json")" = "$VERSION"
          npm pack --dry-run "$STAGING"
      - name: Publish with Trusted Publishing
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          STAGING: ${{ runner.temp }}/pi-client
        run: |
          if npm view "@pontia/pi-client-plugin@$VERSION" version >/dev/null 2>&1; then
            echo "@pontia/pi-client-plugin@$VERSION is already published"
          else
            npm publish "$STAGING" --access public
          fi

  deploy-cloudflare:
    name: Deploy Cloudflare ${{ matrix.app }}
    needs:
      - detect
      - build
      - build-dashboard
    if: ${{ needs.detect.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [cloud, dashboard, cron]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install Rust with the WASM target
        if: matrix.app == 'dashboard'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build Dashboard WASM
        if: matrix.app == 'dashboard'
        run: ../../scripts/build-dashboard-wasm --install-bindgen
      - run: bun install --frozen-lockfile
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          bun run deploy
