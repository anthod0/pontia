name: Release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect version change
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        shell: bash
        env:
          BEFORE_COMMIT: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must run from the main branch" >&2
            exit 1
          fi

          workspace_version() {
            awk '
              /^\[workspace\.package\][[:space:]]*$/ { in_workspace_package = 1; next }
              /^\[/ { in_workspace_package = 0 }
              in_workspace_package && /^[[:space:]]*version[[:space:]]*=/ {
                line = $0
                sub(/^[^"]*"/, "", line)
                sub(/".*$/, "", line)
                print line
                exit
              }
            '
          }

          version="$(workspace_version < Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "Cargo.toml does not define [workspace.package].version" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ -z "$BEFORE_COMMIT" || "$BEFORE_COMMIT" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_COMMIT:Cargo.toml"; then
              echo "Cannot read Cargo.toml from the commit before this push" >&2
              exit 1
            fi

            previous_version="$(git show "$BEFORE_COMMIT:Cargo.toml" | workspace_version)"
            if [[ "$previous_version" == "$version" ]]; then
              echo "Workspace version remains $version; skipping release"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Workspace version changed from $previous_version to $version"
          fi

          if ! grep -Fq "## [$version]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: detect
    if: ${{ needs.detect.outputs.publish == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build binaries
        run: cargo build --release --locked --package pontia --package pontiad
      - name: Build Edge
        if: runner.os == 'Linux'
        run: cargo build --release --locked --package pontia-edge
      - name: Package binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir dist
          binaries=(pontia pontiad)
          if [[ "$TARGET" == *-linux-* ]]; then
            binaries+=(pontia-edge)
          fi
          for binary in "${binaries[@]}"; do
            tar -C target/release -czf "dist/$binary-$TARGET.tar.gz" "$binary"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*.tar.gz
          compression-level: 0

  build-dashboard:
    name: Build Dashboard
    needs: detect
    if: ${{ needs.detect.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Build Dashboard
        run: scripts/build-dashboard-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard
          path: pontia-dashboard.tar.gz
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs:
      - detect
      - build
      - build-dashboard
    if: ${{ needs.detect.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: dashboard
          path: artifacts
      - name: Prepare signed release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_PUBLIC_KEY }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: python3 scripts/publish-release.py prepare-release artifacts --version "$TAG"
      - name: Extract release notes
        shell: bash
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Verify assets and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: python3 scripts/publish-release.py publish-github-release artifacts --version "$TAG"
      - name: Publish verified release to R2 and advance stable
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: python3 scripts/publish-release.py publish-release artifacts --version "$TAG"
