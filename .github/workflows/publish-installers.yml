name: Publish installers

on:
  push:
    branches: [main]
    paths:
      - scripts/install.sh
      - scripts/install-edge.sh
      - .github/scripts/publish-release.py
      - .github/workflows/publish-installers.yml
  workflow_dispatch:

# Installers and version releases write disjoint keys; do not cancel pending releases.
concurrency:
  group: publish-installers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Embed the release verification key
        env:
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_PUBLIC_KEY }}
        run: python3 .github/scripts/publish-release.py prepare-installers installers
      - name: Publish installers to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python3 .github/scripts/publish-release.py publish-installers installers
