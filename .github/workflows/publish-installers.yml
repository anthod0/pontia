name: Publish installers

on:
  push:
    branches: [main]
    paths:
      - scripts/install.sh
      - scripts/install-edge.sh
      - .github/workflows/publish-installers.yml
  workflow_dispatch:

# Installers and version releases write disjoint keys; do not cancel pending releases.
concurrency:
  group: publish-installers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish installers to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          downloaded="$(mktemp -d)"
          trap 'rm -rf "$downloaded"' EXIT
          for name in install.sh install-edge.sh; do
            aws --endpoint-url "$R2_ENDPOINT" s3api put-object \
              --bucket "$R2_BUCKET" \
              --key "$name" \
              --body "scripts/$name" \
              --cache-control "public, max-age=60" \
              --content-type "text/plain"
            aws --endpoint-url "$R2_ENDPOINT" s3api get-object \
              --bucket "$R2_BUCKET" \
              --key "$name" \
              "$downloaded/$name"
            cmp "scripts/$name" "$downloaded/$name"
          done
