name: Website preview

on:
  push:
    paths:
      - apps/website/**
      - .github/workflows/website-preview.yml
  workflow_dispatch:

concurrency:
  group: website-preview-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    name: Deploy Worker preview
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Apply staging migrations
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply DB --remote --config wrangler.preview-migrations.toml
      - name: Deploy Worker preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets" >&2
            exit 1
          fi

          if [[ "$REF_NAME" == "main" ]]; then
            preview_name=staging
          else
            preview_name="$(
              printf '%s' "$REF_NAME" \
                | tr '[:upper:]' '[:lower:]' \
                | tr -c 'a-z0-9' '-' \
                | sed -E 's/-+/-/g; s/^-+//; s/-+$//'
            )"
            preview_name="${preview_name:0:47}"
            preview_name="${preview_name%-}"
            if [[ ! "$preview_name" =~ ^[a-z]([a-z0-9-]*[a-z0-9])?$ ]]; then
              preview_name="preview-${SHA:0:8}"
            fi
          fi

          log_file="$RUNNER_TEMP/wrangler-preview.log"
          output_file="$RUNNER_TEMP/wrangler-preview.json"

          # --json still writes progress logs to stdout before the object.
          bunx wrangler preview \
            --name "$preview_name" \
            --tag "$SHA" \
            --message "$REF_NAME@$SHA" \
            --json | tee "$log_file"

          # JSON.stringify(value, null, 2): only the root braces are unindented.
          awk '
            $0 == "{" { capture = 1 }
            capture { print }
            capture && $0 == "}" { exit }
          ' "$log_file" > "$output_file"
          if [[ ! -s "$output_file" ]]; then
            echo "wrangler preview did not emit JSON" >&2
            exit 1
          fi

          preview_url="$(jq -er '.preview.urls[0]' "$output_file")"
          deployment_url="$(jq -er '.deployment.urls[0]' "$output_file")"
          deployment_id="$(jq -er '.deployment.id' "$output_file")"

          {
            echo "## Website preview"
            echo
            echo "- Preview: \`$preview_name\`"
            echo "- Deployment: \`$deployment_id\`"
            echo "- Preview URL: $preview_url"
            echo "- Deployment URL: $deployment_url"
            echo
            echo "This preview does not change production traffic on pontia.dev."
          } >> "$GITHUB_STEP_SUMMARY"
