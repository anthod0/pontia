name: Publish Cloudflare

on:
  push:
    branches: [main]
    paths:
      - apps/cloud/**
      - apps/dashboard/**
      - apps/cron/**
      - crates/pontia-e2e/**
      - config/**
      - scripts/build-dashboard-wasm
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/publish-cloudflare.yml
  workflow_dispatch:

concurrency:
  group: publish-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.changes.outputs.apps }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        name: Select affected applications
        shell: bash
        env:
          BEFORE_COMMIT: ${{ github.event.before }}
        run: |
          set -euo pipefail

          cloud=false
          dashboard=false
          cron=false

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            cloud=true
            dashboard=true
            cron=true
          elif [[ -z "${BEFORE_COMMIT:-}" || "$BEFORE_COMMIT" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_COMMIT^{commit}"; then
            echo "Cannot determine the previous revision; selecting every application"
            cloud=true
            dashboard=true
            cron=true
          else
            while IFS= read -r path; do
              case "$path" in
                apps/cloud/*)
                  cloud=true
                  ;;
                apps/dashboard/*|crates/pontia-e2e/*|scripts/build-dashboard-wasm|Cargo.toml|Cargo.lock)
                  dashboard=true
                  ;;
                apps/cron/*)
                  cron=true
                  ;;
                config/*|.github/workflows/publish-cloudflare.yml)
                  cloud=true
                  dashboard=true
                  cron=true
                  ;;
              esac
            done < <(git diff --name-only "$BEFORE_COMMIT" "$GITHUB_SHA")
          fi

          apps=()
          [[ "$cloud" == true ]] && apps+=(cloud)
          [[ "$dashboard" == true ]] && apps+=(dashboard)
          [[ "$cron" == true ]] && apps+=(cron)
          apps_json="$(printf '%s\n' "${apps[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "Selected applications: $apps_json"
          echo "apps=$apps_json" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app }}
    needs: detect-changes
    if: needs.detect-changes.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    env:
      VITE_DASHBOARD_MODE: local
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install Rust with the WASM target
        if: matrix.app == 'dashboard'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build Dashboard WASM
        if: matrix.app == 'dashboard'
        run: ../../scripts/build-dashboard-wasm --install-bindgen
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check
        if: matrix.app != 'cron'
        run: bun run check
      - name: Check Cron types
        if: matrix.app == 'cron'
        run: bun x tsc --noEmit
      - name: Test
        run: bun run test
      - name: Check and test Public Dashboard branches
        if: matrix.app == 'dashboard'
        env:
          VITE_DASHBOARD_MODE: public
        run: |
          bun run check
          bun run test
      - name: Build deployable artifact
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.app }}" in
            cloud)
              bun run build
              source=.svelte-kit/cloudflare
              ;;
            dashboard)
              bun run build:public
              source=dist
              ;;
            cron)
              bunx wrangler deploy --dry-run --outdir dist
              source=dist
              ;;
          esac
          mkdir -p "../../artifacts/${{ matrix.app }}"
          cp -a "$source/." "../../artifacts/${{ matrix.app }}/"
      - uses: actions/upload-artifact@v7
        with:
          name: cloudflare-${{ matrix.app }}
          path: artifacts/${{ matrix.app }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy ${{ matrix.app }} production
    needs:
      - detect-changes
      - build
    if: needs.detect-changes.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: cloudflare-${{ matrix.app }}
          path: artifacts/${{ matrix.app }}
      - name: Deploy production
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets" >&2
            exit 1
          fi

          case "${{ matrix.app }}" in
            cloud)
              rm -rf .svelte-kit/cloudflare
              mkdir -p .svelte-kit/cloudflare
              cp -a ../../artifacts/cloud/. .svelte-kit/cloudflare/
              bunx wrangler d1 migrations apply DB --remote --env=
              bunx wrangler deploy --env=
              ;;
            dashboard)
              rm -rf dist
              mkdir -p dist
              cp -a ../../artifacts/dashboard/. dist/
              bunx wrangler deploy
              ;;
            cron)
              bunx wrangler deploy ../../artifacts/cron/index.js --no-bundle --config wrangler.toml
              ;;
          esac
