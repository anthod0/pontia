name: Publish Pi client

on:
  workflow_call:
    inputs:
      version:
        description: Product version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11
      - name: Stage package with the product version
        env:
          STAGING: ${{ runner.temp }}/pi-client
        run: |
          mkdir "$STAGING"
          cp clients/pi/package.json clients/pi/README.md clients/pi/LICENSE "$STAGING/"
          cp -a clients/pi/src "$STAGING/src"
          python3 scripts/release-version.py materialize-npm "$STAGING/package.json"
          test "$(jq -r .version "$STAGING/package.json")" = "${{ inputs.version }}"
          npm pack --dry-run "$STAGING"
      - name: Publish with Trusted Publishing
        env:
          VERSION: ${{ inputs.version }}
          STAGING: ${{ runner.temp }}/pi-client
        run: |
          if npm view "@pontia/pi-client-plugin@$VERSION" version >/dev/null 2>&1; then
            echo "@pontia/pi-client-plugin@$VERSION is already published"
          else
            npm publish "$STAGING" --access public
          fi
