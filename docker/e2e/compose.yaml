# Pin the application domains even when a service is stopped. Docker DNS aliases
# alone could fall back to public DNS after the last matching container exits.
x-local-hosts: &local-hosts
  - "pontia.dev=${E2E_CLOUD_IP:?Use scripts/docker-e2e}"
  - "app.pontia.dev=${E2E_DASHBOARD_IP:?Use scripts/docker-e2e}"
  - "__probe.docker-e2e.p.pontia.dev=${E2E_EDGE_IP:?Use scripts/docker-e2e}"
  - "docker-e2e.edge.pontia.dev=${E2E_EDGE_IP:?Use scripts/docker-e2e}"

x-preview-certificate: &preview-certificate
  type: bind
  source: ${E2E_STATE}/preview-cert.pem
  target: /run/preview-cert.pem
  read_only: true
  bind:
    create_host_path: false

x-build: &build
  context: ../..
  dockerfile: docker/e2e/Dockerfile
  network: host
  args:
    E2E_CAPABILITY_VERIFICATION_KEY: ${E2E_CAPABILITY_VERIFICATION_KEY:?Use scripts/docker-e2e}
  entitlements:
    - network.host

services:
  cloud:
    image: ${E2E_IMAGES}-cloud:latest
    build:
      <<: *build
      target: cloud
    init: true
    environment:
      NODE_EXTRA_CA_CERTS: /run/preview-cert.pem
    extra_hosts: *local-hosts
    volumes:
      - *preview-certificate
      - type: bind
        source: ${E2E_CONFIG}/cloud.dev.vars
        target: /app/.dev.vars
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${E2E_CONFIG}/tls
        target: /tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${E2E_STATE}/cloud-bootstrap.sql
        target: /app/e2e-bootstrap.sql
        read_only: true
        bind:
          create_host_path: false
      - cloud-state:/state
    networks:
      lab:
        ipv4_address: ${E2E_CLOUD_IP:?Use scripts/docker-e2e}
      outbound: {}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--resolve", "pontia.dev:443:127.0.0.1", "https://pontia.dev/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  dashboard:
    image: ${E2E_IMAGES}-dashboard:latest
    build:
      <<: *build
      target: dashboard
    init: true
    extra_hosts: *local-hosts
    volumes:
      - type: bind
        source: ${E2E_CONFIG}/tls
        target: /tls
        read_only: true
        bind:
          create_host_path: false
    networks:
      lab:
        ipv4_address: ${E2E_DASHBOARD_IP:?Use scripts/docker-e2e}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--resolve", "app.pontia.dev:443:127.0.0.1", "https://app.pontia.dev/"]
      interval: 5s
      timeout: 5s
      retries: 10

  edge:
    image: ${E2E_IMAGES}-edge:latest
    build:
      <<: *build
      target: edge
    init: true
    environment:
      E2E_EDGE_HOST: docker-e2e.edge.pontia.dev
    extra_hosts: *local-hosts
    volumes:
      - type: bind
        source: ${E2E_STATE}/edge
        target: /etc/pontia/edge
        read_only: true
        bind:
          create_host_path: false
    networks:
      lab:
        ipv4_address: ${E2E_EDGE_IP:?Use scripts/docker-e2e}
    depends_on:
      cloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --resolve \"$$E2E_EDGE_HOST:443:127.0.0.1\" \"https://$$E2E_EDGE_HOST/healthz\""]
      interval: 5s
      timeout: 5s
      retries: 10

  device:
    image: ${E2E_IMAGES}-device:latest
    build:
      <<: *build
      target: device
    init: true
    tmpfs:
      - /run/claude-proxy:uid=1000,gid=1000,mode=0700,size=16m
    cap_drop: [ALL]
    # Moby profiles 4b8214fc4971e06172938a1f1554ccff6647ee80/seccomp/default.json,
    # plus clone, unshare, mount, umount2, pivot_root and setns for Codex's
    # nested user namespaces. Retain the default-deny policy and no capabilities.
    security_opt:
      - seccomp=./device-seccomp.json
    environment:
      PONTIA_AUTH_ORIGIN: https://pontia.dev
    extra_hosts: *local-hosts
    volumes:
      - device-home:/home/e2e
      - type: bind
        source: ${E2E_CONFIG}/openai-api-key
        target: /run/secrets/openai-api-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${E2E_STATE}/auth/device
        target: /e2e-auth
        read_only: true
        bind:
          create_host_path: false
    networks:
      lab:
        ipv4_address: ${E2E_DEVICE_IP:?Use scripts/docker-e2e}
      outbound: {}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  browser:
    image: ${E2E_IMAGES}-browser:latest
    build:
      <<: *build
      target: browser
    hostname: pontia-e2e-browser
    init: true
    environment:
      E2E_EDGE_IP: ${E2E_EDGE_IP:?Use scripts/docker-e2e}
    shm_size: 1gb
    extra_hosts: *local-hosts
    ports:
      - "127.0.0.1::6080"
    volumes:
      - browser-home:/home/e2e
      - *preview-certificate
      - type: bind
        source: ${E2E_STATE}/auth/browser
        target: /e2e-auth
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${E2E_STATE}/browser-login.json
        target: /run/secrets/browser-login.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      lab:
        ipv4_address: ${E2E_BROWSER_IP:?Use scripts/docker-e2e}
      outbound: {}
    depends_on:
      cloud:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      device:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:6080/vnc.html"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  lab:
    external: true
    name: ${E2E_NETWORK}
  outbound: {}

volumes:
  cloud-state:
  device-home:
  browser-home:
