[package]
name = "pontia-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
flate2 = "1"
pontia-application.workspace = true
pontia-config.workspace = true
pontia-core.workspace = true
pontia-workflow.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tar = "0.4"
time = { workspace = true, features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["sync", "time", "net"] }
tokio-stream = "0.1"
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
pontia-client-codex.workspace = true
pontia-client-pi.workspace = true
http-body-util = "0.1"
pontia-application = { workspace = true, default-features = true, features = ["generic-test-client"] }
pontia-runtime = { workspace = true, default-features = true }
pontia-storage-sqlite.workspace = true
sqlx.workspace = true
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }

[features]
default = []
