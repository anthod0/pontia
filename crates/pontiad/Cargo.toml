[package]
name = "pontiad"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pontia-client-codex.workspace = true
pontia-client-pi.workspace = true
axum = "0.8"
pontia-application = { workspace = true, default-features = true }
pontia-config = { workspace = true, default-features = true }
pontia-core.workspace = true
pontia-http.workspace = true
pontia-runtime.workspace = true
pontia-storage-sqlite.workspace = true
pontia-workflow.workspace = true
pontia-tunnel.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { workspace = true, features = ["v7", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
http-body-util = "0.1"
pontia-edge.workspace = true
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
