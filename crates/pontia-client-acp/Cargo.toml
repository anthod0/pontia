[package]
name = "pontia-client-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
agent-client-protocol = "5.4.0"
pontia-agent-control.workspace = true
pontia-core.workspace = true
pontia-runtime.workspace = true
pontia-storage-sqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx.workspace = true
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "sync", "io-util"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util", "net"] }

[[bin]]
name = "pontia-acp-test-relay"
path = "test-support/stdio-relay.rs"
