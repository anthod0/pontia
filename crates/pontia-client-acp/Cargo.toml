[package]
name = "pontia-client-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent-client-protocol = "3.3.0"
bzip2 = "0.5"
flate2 = "1"
pontia-application.workspace = true
pontia-config.workspace = true
pontia-core.workspace = true
pontia-runtime.workspace = true
pontia-storage-sqlite.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
sqlx.workspace = true
tar = "0.4"
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "sync", "io-util"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
tracing = "0.1.44"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util", "net"] }
