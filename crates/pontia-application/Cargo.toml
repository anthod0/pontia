[package]
name = "pontia-application"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pontia-agent-clients.workspace = true
pontia-config.workspace = true
pontia-core.workspace = true
pontia-runtime.workspace = true
pontia-storage-sqlite.workspace = true
ignore = "0.4"
nucleo-matcher = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
uuid = { workspace = true, features = ["v7", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }

[dev-dependencies]
pontia-agent-clients = { workspace = true, default-features = true, features = ["generic-test-client"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[features]
default = []
