[package]
name = "pontia-bot"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pontia-agent-control.workspace = true
pontia-core.workspace = true
pontia-config.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["fs", "rt", "sync"] }
tracing = "0.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
uuid = { workspace = true, features = ["v4", "v7"] }

[dev-dependencies]
pontia-agent-control = { workspace = true, features = ["generic-test-client"] }
pontia-runtime.workspace = true
pontia-storage-sqlite.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util"] }
