[package]
name = "pontia-agent-control"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-stream = "0.3"
tokio-stream = "0.1"
sha2 = "0.10"
base64 = "0.22"
pontia-config.workspace = true
pontia-core.workspace = true
pontia-runtime.workspace = true
pontia-storage-sqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "net", "process", "io-util", "signal"] }
tracing = "0.1"
uuid = { workspace = true, features = ["v7", "serde"] }

[dev-dependencies]
pontia-agent-control = { path = ".", features = ["generic-test-client"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[features]
default = []
generic-test-client = []
