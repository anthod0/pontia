[package]
name = "pontia-client-codex"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pontia-application.workspace = true
pontia-core.workspace = true
pontia-runtime.workspace = true
pontia-storage-sqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
futures-util = "0.3.34"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "process", "io-util", "macros"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
