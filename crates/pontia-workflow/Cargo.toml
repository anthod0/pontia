[package]
name = "pontia-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pontia-application.workspace = true
pontia-core.workspace = true
pontia-storage-sqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
tokio = { version = "1", features = ["fs", "rt", "sync"] }
thiserror.workspace = true
tracing = "0.1"
uuid = { workspace = true, features = ["v7"] }
toml = "0.9"

[dev-dependencies]
pontia-agent-clients = { workspace = true, features = ["generic-test-client"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
