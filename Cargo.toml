[workspace]
members = [
    "crates/pontia-e2e",
    "crates/pontia-edge",
    "crates/pontia-update",
    "crates/pontia-tunnel",
    "crates/pontiad",
    "crates/pontia-core",
    "crates/pontia-storage-sqlite",
    "crates/pontia-config",
    "crates/pontia-runtime",
    "crates/pontia-application",
    "crates/pontia-client-pi",
    "crates/pontia-http",
    "crates/pontia",
    "crates/pontia-workflow",
]
# Codex integration is frozen until its session-runtimes migration.
exclude = ["crates/pontia-client-codex"]
default-members = ["crates/pontiad"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/anthod0/pontia"

[workspace.dependencies]
pontia-client-pi = { path = "crates/pontia-client-pi" }
pontia-application = { path = "crates/pontia-application", default-features = false }
pontia-config = { path = "crates/pontia-config", default-features = false }
pontia-core = { path = "crates/pontia-core", default-features = false }
pontia-e2e = { path = "crates/pontia-e2e" }
pontia-http = { path = "crates/pontia-http" }
pontia-runtime = { path = "crates/pontia-runtime", default-features = false }
pontia-storage-sqlite = { path = "crates/pontia-storage-sqlite" }
pontia-tunnel = { path = "crates/pontia-tunnel" }
pontia-workflow = { path = "crates/pontia-workflow" }

serde = "1"
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
thiserror = "2"
time = "0.3"
uuid = "1"
